<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SteelSeries Rival 3 Gen 2</title>
  <desc id="desc">Top-down artwork of the black wired SteelSeries Rival 3 Gen 2 gaming mouse with three-zone RGB lighting</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303136"/>
      <stop offset="0.45" stop-color="#111216"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3e45"/>
      <stop offset="1" stop-color="#090a0d"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
