name: RGB Preview

on:
  push:
    branches:
      - feat/rival3-gen2-rgb

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-rgb
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm install

      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          OPENMOUSE_BUILD_CHANNEL: beta

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
